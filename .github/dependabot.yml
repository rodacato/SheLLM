version: 2
updates:
  # Always on: the workflows are inline, so nothing else bumps their action pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
