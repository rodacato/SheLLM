version: 2
updates:
  # Always on: the workflows are inline, so nothing else bumps their action pins.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # A hijacked release is usually yanked within days; security updates skip the wait.
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # better-sqlite3 13.x publishes no prebuilt binary for any ABI, so installing it compiles
    # from source. A major moves by hand, once a prebuild for the target Node ABI exists.
    ignore:
      - dependency-name: better-sqlite3
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: devcontainers
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
