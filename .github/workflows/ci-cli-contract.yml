name: CI · CLI Contract

# A PR runs the pinned CLIs, so a Dependabot bump is tested at the version it proposes. The weekly
# run takes the latest of each, which is the only warning of a major Dependabot does not propose.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "src/providers/**"
      - "test/cli/**"
      - "config/cli-versions/**"
      - ".github/workflows/ci-cli-contract.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the CLIs
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            pins=config/cli-versions/package.json
            claude=$(node -p "require('./$pins').dependencies['@anthropic-ai/claude-code']")
            codex=$(node -p "require('./$pins').dependencies['@openai/codex']")
          else
            claude=latest
            codex=latest
          fi
          npm install -g "@anthropic-ai/claude-code@$claude" "@openai/codex@$codex"
      - run: claude --version && codex --version
      - run: npm run test:cli
