name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Advisory: the minimum in `npm run test:coverage` reports without failing the check.
  # Set to "true" to make a coverage drop block a merge.
  COVERAGE_BLOCKING: "false"

jobs:
  test:
    name: Lint, Audit & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint the OpenAPI spec
        run: npm run docs:lint

      # docs/api/bundled.json is committed and is what a self-hosted instance serves at
      # /docs/openapi.json. Linting the source says nothing about whether the bundle matches it.
      - name: Check the bundled spec matches its source
        run: |
          npm run docs:build
          git diff --exit-code docs/api/bundled.json

      - name: Audit runtime dependencies
        run: npm run audit:security

      - name: Test
        run: npm test

      # Separate from the step above so a failing test always blocks while the minimum only warns.
      - name: Coverage
        continue-on-error: ${{ env.COVERAGE_BLOCKING != 'true' }}
        run: npm run test:coverage
