name: CLI contract

# vps.sh pins both CLIs, so an upstream release can drop a flag the providers pass long before
# the pin moves. This runs against the latest of each, weekly, to catch it before the bump.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - "src/providers/**"
      - "test/cli/**"
      - ".github/workflows/cli-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install -g @anthropic-ai/claude-code@latest @openai/codex@latest
      - run: claude --version && codex --version
      - run: npm run test:cli
