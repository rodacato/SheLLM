name: Pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'assets/**'
      - 'docs/api/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel in-progress so a deploy always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Assemble the site
        run: |
          mkdir -p site/assets site/img
          cp -r assets/favicon site/assets/favicon
          cp -r assets/logo site/assets/logo
          cp assets/site/overview.png site/img/overview.png
          cp assets/site/request-logs.png site/img/request-logs.png
          cp assets/site/api-keys.png site/img/api-keys.png
          cp assets/site/playground.png site/img/playground.png
          cp assets/site/system.png site/img/system.png
          cp assets/site/example-knotty.jpg site/img/example-knotty.jpg
          cp assets/site/example-ai-town.jpg site/img/example-ai-town.jpg

      - name: Build the API reference
        run: |
          npm run docs:build
          cp docs/api/bundled.json site/api/bundled.json
          cp docs/api/logo.svg site/api/logo.svg

      # The page carries no version of its own: a landing page that names a release is a landing
      # page that is wrong one release later.
      - name: Stamp the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          sed -i "s/__VERSION__/$version/" site/index.html
          grep -q "$version" site/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
