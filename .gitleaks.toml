title = "SheLLM Gitleaks Config"

[extend]
useDefault = true

# gitleaks-action runs 8.24, which silently ignores [[allowlists]] and targetRules; it reads only this table.
[allowlist]
description = "Identifiers generic-api-key mistakes for keys: Pencil's .pen fileToken, claude's api_message_id"
regexTarget = "match"
regexes = [
  '''fileToken"?\s*:''',
  '''api_message_id"?\s*:\s*"msg_[A-Za-z0-9]+''',
]
