# API list prices for estimating a request a CLI did not price (ADR-0012). USD per 1M tokens.
# Keyed by the model that ran (upstream_model). An unlisted model gets no estimate, never a guess.
# Rows are priced when logged: an edit applies from the next request and never re-prices history.
# long_context applies above long_context_above input tokens; no cache_write prices writes as input.

long_context_above: 272000

models:
  # Source: https://developers.openai.com/api/docs/pricing — Standard tier, read 2026-10-13.
  gpt-6-astra:
    input: 10.00
    cached_input: 1.00
    cache_write: 12.50
    output: 50.00
    long_context: { input: 20.00, cached_input: 2.00, cache_write: 25.00, output: 75.00 }

  # Promotional pricing "at least through November 21, 2026"; the later price is not published.
  gpt-5.6-sol:
    input: 4.00
    cached_input: 0.40
    cache_write: 5.00
    output: 20.00
    long_context: { input: 8.00, cached_input: 0.80, cache_write: 10.00, output: 30.00 }

  gpt-5.6-terra:
    input: 2.00
    cached_input: 0.20
    cache_write: 2.50
    output: 12.00
    long_context: { input: 4.00, cached_input: 0.40, cache_write: 5.00, output: 18.00 }

  gpt-5.6-luna:
    input: 0.20
    cached_input: 0.02
    cache_write: 0.25
    output: 1.20
    long_context: { input: 0.40, cached_input: 0.04, cache_write: 0.50, output: 1.80 }

  # Retires 2026-10-14 in the baked catalog; kept so rows logged before then are still priced.
  gpt-5.5:
    input: 5.00
    cached_input: 0.50
    output: 30.00
    long_context: { input: 10.00, cached_input: 1.00, output: 45.00 }
