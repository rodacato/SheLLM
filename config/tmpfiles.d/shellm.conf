# The directory the dashboard and the updater exchange the update request through.
#
# tmpfiles.d, not RuntimeDirectory= in shellm.service: systemd removes a runtime directory when
# its unit stops, and the updater stops that unit halfway through its own sequence.
#
# Owned by shellmer because the writer is the confined service; 0750 keeps it off every other
# account on the box. shellm.service lists it as ReadWritePaths=-/run/shellm — the leading dash
# is what lets the service start on a host where this file was never installed.
#
# Installing this on a host where shellm.service is already running is not enough on its own:
# ProtectSystem=strict mounts /run read-only inside the service's namespace, the namespace is
# built when the service starts, and ReadWritePaths= skips a path that does not exist yet. The
# service has to be restarted after the directory first appears. scripts/setup/vps.sh does that.
d /run/shellm 0750 shellmer shellmer -
