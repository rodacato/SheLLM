get:
  operationId: listLogs
  tags: [Logs]
  summary: List request logs
  security:
    - BasicAuth: []
  parameters:
    - $ref: "../parameters/Limit.yaml"
    - $ref: "../parameters/Offset.yaml"
    - $ref: "../parameters/LogProvider.yaml"
    - $ref: "../parameters/LogClient.yaml"
    - $ref: "../parameters/LogModel.yaml"
    - $ref: "../parameters/LogErrorCode.yaml"
    - $ref: "../parameters/LogStatus.yaml"
    - $ref: "../parameters/LogFrom.yaml"
    - $ref: "../parameters/LogTo.yaml"
  responses:
    '200':
      description: Paginated logs
      content:
        application/json:
          schema:
            $ref: "../schemas/LogsResponse.yaml"
    '401':
      $ref: "../responses/Unauthorized.yaml"
    '429':
      $ref: "../responses/RateLimited.yaml"

delete:
  operationId: clearLogs
  tags: [Logs]
  summary: Delete all request logs
  description: Deletes every row, ignoring the filters the list endpoint takes.
  security:
    - BasicAuth: []
  responses:
    '200':
      description: Logs deleted
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted:
                type: integer
                description: Number of log entries deleted
    '401':
      $ref: "../responses/Unauthorized.yaml"
    '429':
      $ref: "../responses/RateLimited.yaml"
