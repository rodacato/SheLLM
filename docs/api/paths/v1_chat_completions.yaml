post:
  operationId: createChatCompletion
  tags: [Chat Completions]
  summary: Create a chat completion
  description: |
    OpenAI-compatible endpoint. Sends the prompt to the requested provider
    CLI and returns the response in OpenAI format. Set `stream` to `true`
    for server-sent events instead of one JSON body.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/ChatCompletionRequest.yaml"
  responses:
    '200':
      description: Chat completion
      headers:
        X-Queue-Depth:
          schema:
            type: integer
        X-Queue-Active:
          schema:
            type: integer
        x-shellm-queue-ms:
          description: Milliseconds the request waited for a free CLI slot.
          schema:
            type: integer
        x-shellm-queue-position:
          description: >
            Where the request stood in the queue, or 0 when a slot was free. A streamed response
            carries this header before any body, since the wait happens after the headers flush.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "../schemas/ChatCompletionResponse.yaml"
        text/event-stream:
          schema:
            type: string
            description: |
              Sent when `stream` is `true`: `data:` lines carrying
              `chat.completion.chunk` objects, terminated by `data: [DONE]`.
    '400':
      $ref: "../responses/BadRequestOpenAI.yaml"
    '401':
      $ref: "../responses/UnauthorizedOpenAI.yaml"
    '403':
      $ref: "../responses/OriginNotAllowedOpenAI.yaml"
    '413':
      description: |
        The body is larger than `SHELLM_MAX_CHAT_BODY_BYTES` (20 MiB by default). Checked after the
        key, so an unauthenticated caller gets a 401 instead.
      content:
        application/json:
          schema:
            $ref: "../schemas/OpenAIError.yaml"
    '429':
      $ref: "../responses/RateLimitedOpenAI.yaml"
    '502':
      description: Provider CLI failed
      content:
        application/json:
          schema:
            $ref: "../schemas/OpenAIError.yaml"
    '503':
      description: Provider unavailable
      content:
        application/json:
          schema:
            $ref: "../schemas/OpenAIError.yaml"
    '504':
      description: Provider timeout
      content:
        application/json:
          schema:
            $ref: "../schemas/OpenAIError.yaml"
