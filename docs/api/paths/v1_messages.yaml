post:
  operationId: createMessage
  tags: [Messages]
  summary: Create a message
  description: |
    Anthropic-compatible endpoint. Sends the prompt to the requested provider
    CLI and returns the response in Anthropic Messages format. Set `stream` to `true`
    for server-sent events instead of one JSON body.
  security:
    - BearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../schemas/MessagesRequest.yaml"
  responses:
    '200':
      description: Message response
      headers:
        X-Queue-Depth:
          schema:
            type: integer
        X-Queue-Active:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "../schemas/MessagesResponse.yaml"
        text/event-stream:
          schema:
            type: string
            description: |
              Sent when `stream` is `true`: `message_start`, `content_block_start`, a run of
              `content_block_delta`, `content_block_stop`, `message_delta`, `message_stop`.
    '400':
      $ref: "../responses/BadRequestAnthropic.yaml"
    '401':
      $ref: "../responses/UnauthorizedAnthropic.yaml"
    '429':
      $ref: "../responses/RateLimitedAnthropic.yaml"
    '502':
      description: Provider CLI failed
      content:
        application/json:
          schema:
            $ref: "../schemas/AnthropicError.yaml"
    '503':
      description: Provider unavailable
      content:
        application/json:
          schema:
            $ref: "../schemas/AnthropicError.yaml"
    '504':
      description: Provider timeout
      content:
        application/json:
          schema:
            $ref: "../schemas/AnthropicError.yaml"
