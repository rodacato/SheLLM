type: object
required: [model, messages]
properties:
  model:
    type: string
    description: Provider name, or a model id the provider's CLI accepts
    example: claude-haiku
  messages:
    type: array
    minItems: 1
    items:
      $ref: "./ChatRequestMessage.yaml"
    description: |
      Must contain at least one `user` message. The first `system` message becomes the system
      prompt; the rest are flattened into one prompt, since the CLI takes a prompt, not a thread.
  max_tokens:
    type: integer
    minimum: 1
    maximum: 128000
    description: |
      Validated and then ignored — no CLI exposes an output cap. Bound the length in the prompt.
  stream:
    type: boolean
    default: false
    description: |
      `true` answers `text/event-stream` with OpenAI-style `data:` chunks and a `[DONE]`
      terminator. Streaming holds a slot for the whole response and is capped separately by
      `MAX_STREAM_CONCURRENT`.
  stream_options:
    type: object
    description: >
      Only valid with `stream: true`; sending it otherwise is a 400. With `include_usage: true` a
      final chunk with an empty `choices` array carries `usage` and `x_shellm`.
    properties:
      include_usage:
        type: boolean
  reasoning_effort:
    type: string
    enum: [minimal, low, medium, high]
    description: >
      How long the model reasons before answering: --effort for Claude, model_reasoning_effort for
      Codex. minimal runs as low, since Claude has nothing below it and Codex's default model refuses
      it. Omitted, Claude uses SHELLM_CLAUDE_EFFORT (medium) and Codex its own configuration.
      Reasoning is billed as completion tokens and nothing streams while it runs.
  temperature:
    type: number
    minimum: 0
    maximum: 2
  top_p:
    type: number
    minimum: 0
    maximum: 1
  response_format:
    type: object
    required: [type]
    description: |
      `json_schema` constrains the answer to a JSON Schema and returns it as a string in
      `choices[0].message.content`. Codex applies OpenAI's strict-mode rules whatever `strict`
      says. Every refusal of this field is a 400 whose message names `response_format`.
    properties:
      type:
        type: string
        enum: [json_schema, json_object, text]
      json_schema:
        type: object
        description: Required when `type` is `json_schema`.
        required: [name, schema]
        properties:
          name:
            type: string
            pattern: "^[a-zA-Z0-9_-]{1,64}$"
          schema:
            type: object
            description: A JSON Schema, at most 100 KiB serialized.
            additionalProperties: true
          strict:
            type: boolean
  stop:
    description: Up to 4 stop sequences.
    oneOf:
      - type: string
      - type: array
        maxItems: 4
        items:
          type: string
