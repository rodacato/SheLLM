type: object
required: [model, messages]
properties:
  model:
    type: string
    description: Provider name, or a model id the provider's CLI accepts
    example: claude-haiku
  messages:
    type: array
    minItems: 1
    items:
      $ref: "./ChatMessage.yaml"
  max_tokens:
    type: integer
    minimum: 1
    maximum: 128000
