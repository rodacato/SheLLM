type: object
properties:
  status:
    type: string
    enum: [ok, degraded, down]
    description: |
      `degraded` when some enabled provider is not authenticated, `down` when none is,
      `ok` when all are — or when no provider is enabled at all.
  timezone:
    type: string
    description: |
      IANA zone the dashboard renders every timestamp in, from `SHELLM_TZ`. Defaults to
      `America/Mexico_City`; an unknown name falls back to it rather than failing the request.
    example: America/Mexico_City
  providers:
    type: object
    additionalProperties:
      $ref: "./ProviderStatus.yaml"
  build:
    type: object
    properties:
      version:
        type: string
      commit:
        type: string
  circuit_breakers:
    type: object
    additionalProperties:
      type: object
      properties:
        state:
          type: string
          enum: [closed, open, half_open]
        failures:
          type: integer
        lastFailureAt:
          type: [integer, "null"]
        lastTransitionAt:
          type: [integer, "null"]
  queue:
    type: object
    properties:
      pending:
        type: integer
      active:
        type: integer
      max_concurrent:
        type: integer
  uptime_seconds:
    type: integer
