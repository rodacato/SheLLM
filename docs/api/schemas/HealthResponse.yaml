type: object
properties:
  status:
    type: string
    enum: [ok, degraded, down]
    description: |
      `degraded` when some enabled provider is not authenticated, `down` when none is,
      `ok` when all are — or when no provider is enabled at all.
  timezone:
    type: string
    description: |
      IANA zone the dashboard renders every timestamp in, from `SHELLM_TZ`. Unset or unknown, it
      falls back to the default in `src/lib/time.js` rather than failing the request.
    example: America/Mexico_City
  providers:
    type: object
    additionalProperties:
      $ref: "./ProviderStatus.yaml"
  build:
    type: object
    properties:
      version:
        type: string
      commit:
        type: string
  circuit_breakers:
    type: object
    additionalProperties:
      type: object
      properties:
        state:
          type: string
          enum: [closed, open, half_open]
        failures:
          type: integer
        lastFailureAt:
          type: [integer, "null"]
        lastError:
          description: The latest failure counted against the circuit, credentials redacted. Kept after the circuit closes.
          type: [object, "null"]
          properties:
            code:
              type: string
              example: cli_failed
            message:
              type: string
        lastTransitionAt:
          type: [integer, "null"]
  queue:
    type: object
    properties:
      pending:
        type: integer
      active:
        type: integer
      max_concurrent:
        type: integer
      timeout_ms:
        type: integer
        description: TIMEOUT_MS, the age at which a running CLI process is killed.
      in_flight:
        type: array
        description: >
          Every request running or waiting for a slot, running first (oldest first), then the line
          in order. Held in memory only: a restart clears it.
        items:
          type: object
          properties:
            state:
              type: string
              enum: [running, queued]
            age_ms:
              type: integer
            position:
              type: integer
              description: Place in line; only on a queued request.
            request_id:
              type: [string, "null"]
            client:
              type: [string, "null"]
            path:
              type: string
            stream:
              type: boolean
            provider:
              type: string
            model:
              type: string
      oldest_age_ms:
        type: [integer, "null"]
        description: Age of the longest-running request; null when none is running.
  uptime_seconds:
    type: integer
