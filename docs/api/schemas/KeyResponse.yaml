type: object
properties:
  id:
    type: integer
  name:
    type: string
  key_prefix:
    type: string
    example: shellm-a
  key_suffix:
    type: [string, 'null']
    description: >
      The key's last 4 characters, so it can be matched against the key an app holds. null for a
      key created before v1.23.0 and not rotated since.
    example: 9f0e
  rpm:
    type: integer
  models:
    type: [array, 'null']
    items:
      type: string
  origins:
    type: [array, 'null']
    items:
      type: string
      format: uri
    description: >
      Browser origins allowed to use this key (scheme://host[:port], exact match). null or absent
      means any caller. A request carrying another Origin gets 403 origin_not_allowed; a request
      with no Origin is accepted, so this scopes pages rather than authenticating callers.
    example: ["https://you.github.io"]
  spend_limit_usd:
    type: [number, 'null']
    exclusiveMinimum: 0
    description: >
      Monthly cap on the key's API-equivalent cost (reported plus estimated), in USD, per calendar
      month in UTC. null or absent means no cap. Once reached, requests get 429
      spend_limit_exceeded until the 1st. Approximate: the request that crosses it still finishes.
    example: 100
  month_spend:
    type: ['object', 'null']
    description: Listed by GET /admin/keys for a key with a spend limit; null otherwise.
    properties:
      spent_usd:
        type: number
      resets_at:
        type: string
        format: date-time
  active:
    type: integer
    enum: [0, 1]
  created_at:
    type: string
    format: date-time
