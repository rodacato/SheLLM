type: object
properties:
  name:
    type: string
    minLength: 1
    description: >
      Renames the key. Must be unique. The key's request logs are relabelled with it, so its
      history follows the key.
  rpm:
    type: integer
    minimum: 1
  models:
    type: [array, 'null']
    items:
      type: string
  origins:
    type: [array, 'null']
    items:
      type: string
      format: uri
    description: >
      Browser origins allowed to use this key (scheme://host[:port], exact match). null or absent
      means any caller. A request carrying another Origin gets 403 origin_not_allowed; a request
      with no Origin is accepted, so this scopes pages rather than authenticating callers.
    example: ["https://you.github.io"]
  active:
    type: integer
    enum: [0, 1]
