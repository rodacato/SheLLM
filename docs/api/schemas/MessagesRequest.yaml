type: object
required: [model, messages, max_tokens]
properties:
  model:
    type: string
    example: claude
  messages:
    type: array
    minItems: 1
    items:
      $ref: "./AnthropicMessage.yaml"
  max_tokens:
    type: integer
    minimum: 1
    maximum: 128000
  system:
    type: string
    description: Optional system prompt
  stream:
    type: boolean
    default: false
    description: |
      `true` answers `text/event-stream` with Anthropic's named events. `message_start` is sent
      before the CLI has produced anything, so wait for `content_block_delta` to call it the first
      token. Streaming is capped separately by `MAX_STREAM_CONCURRENT`.
  output_config:
    type: object
    description: |
      `format` makes the answer JSON valid against `schema`, validated by the Claude CLI
      (`--json-schema`) or Codex (`--output-schema`); the text block carries it whole, and a
      streamed answer arrives in one delta once validated. `effort` sets how hard the model thinks.
    properties:
      effort:
        type: string
        enum: [low, medium, high, xhigh, max]
      format:
        type: object
        required: [type, schema]
        properties:
          type:
            type: string
            enum: [json_schema]
          schema:
            type: object
            description: A JSON Schema of at most 100 KiB
