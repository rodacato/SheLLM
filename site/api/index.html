<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SheLLM API Reference</title>
    <meta name="description" content="SheLLM exposes the owner's own LLM CLI subscriptions (Claude Code, Codex) as one REST API that answers in both the OpenAI and the Anthropic formats.">
    <meta name="theme-color" content="#101417">
    <meta property="og:title" content="SheLLM API Reference">
    <meta property="og:description" content="SheLLM exposes the owner's own LLM CLI subscriptions (Claude Code, Codex) as one REST API that answers in both the OpenAI and the Anthropic formats.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://rodacato.github.io/SheLLM/api/">
    <meta property="og:image" content="https://rodacato.github.io/SheLLM/img/overview.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/favicon-180.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      /* ── Fonts ── */
      body, html { font-family: 'Inter', system-ui, sans-serif !important; margin: 0; padding: 0; }
      h1, h2, h3, h4, h5 { font-family: 'Space Grotesk', system-ui, sans-serif !important; color: #FFFFFF !important; }

      /* ── Page & panel backgrounds ── */
      body, html { background: #101417 !important; }
      [role="main"],
      .menu-content + div { background: #101417 !important; }

      /* ── Operation path in endpoint blocks ── */
      span[class*="path"] { color: #e0e3e7 !important; }

      /* Group labels read as labels through case and tracking, not through a dimmer colour:
         #3b494c on the #0b0f12 sidebar is 2.06:1, and this text is 11px uppercase. */
      li[class*="group"] > label {
        color: #849397 !important;
        font-family: 'Space Grotesk', sans-serif !important;
        font-size: 0.6875rem !important;
        letter-spacing: 0.15em !important;
        text-transform: uppercase !important;
      }

      /* ── Active sidebar item: the admin nav's selected state. An inset shadow draws its 4px
         edge without shifting the label the way a border would. ── */
      li[class*="active"] > a,
      li[class*="active"] > label {
        color: #03E3FF !important;
        background: #2e3b44 !important;
        border-radius: 0 !important;
        box-shadow: inset 4px 0 0 #03E3FF !important;
        font-weight: 700 !important;
      }

      /* ── Property tables ── */
      tr { border-color: #3b494c !important; }
      td { color: #e0e3e7 !important; }

      /* ── Required badge ── */
      span[class*="required"] { color: #ffb4ab !important; }

      /* ── Sidebar logo: Redoc gives x-logo no size of its own, so it grows to the sidebar's width ── */
      .menu-content img {
        max-height: 2rem !important;
        width: auto !important;
        margin: 1.5rem 0 1.25rem 1.25rem !important;
      }

      /* ── Back to the landing page: x-logo.href wraps the mark in a link Redoc centers ── */
      .menu-content a:has(> img) { display: block; text-align: left; }
      .menu-content a:has(> img):hover { opacity: 0.7; }

      /* ── Below Redoc's 50rem breakpoint the sidebar and its linked logo are gone, so this floats instead ── */
      .home { display: none; }
      @media (max-width: 50rem) {
        .home { display: block; position: fixed; z-index: 100; top: 1rem; left: 1.25rem;
                font-family: 'Space Grotesk', sans-serif; font-size: 0.75rem; letter-spacing: 0.12em;
                text-transform: uppercase; color: #849397; text-decoration: none; }
        .home:hover { color: #03E3FF; }
      }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #101417; }
      ::-webkit-scrollbar-thumb { background: #262a2e; border-radius: 0; }
      ::-webkit-scrollbar-thumb:hover { background: #313538; }

      .fallback { max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; color: #e0e3e7; line-height: 1.7; }
      .fallback a { color: #03E3FF; }
    </style>
  </head>
  <body>
    <a class="home" href="../">&gt;_ SheLLM</a>
    <noscript>
      <p class="fallback">This reference is rendered by Redoc from a CDN. The OpenAPI document itself:
        <a href="bundled.json">bundled.json</a> ·
        <a href="https://github.com/rodacato/SheLLM/blob/master/docs/api/openapi.yaml">openapi.yaml</a></p>
    </noscript>
    <p class="fallback" id="fallback" hidden>This reference is rendered by Redoc from a CDN, which did not load. The OpenAPI document itself:
      <a href="bundled.json">bundled.json</a> ·
      <a href="https://github.com/rodacato/SheLLM/blob/master/docs/api/openapi.yaml">openapi.yaml</a></p>
    <div id="redoc-container"></div>
    <script src="https://cdn.redocly.com/redoc/v2.5.0/bundles/redoc.standalone.js"
            onerror="document.getElementById('fallback').hidden = false"></script>
    <script>
      if (window.Redoc) Redoc.init('bundled.json', {
        theme: {
          colors: {
            primary: { main: '#03E3FF' },
            success: { main: '#22c55e' },
            error: { main: '#ffb4ab' },
            text: { primary: '#e0e3e7', secondary: '#849397' },
            border: { dark: '#3b494c', light: '#262a2e' },
            http: {
              get: '#03E3FF',
              post: '#22c55e',
              put: '#ffb800',
              delete: '#ffb4ab',
              patch: '#bac9cd'
            }
          },
          sidebar: {
            backgroundColor: '#0b0f12',
            textColor: '#849397',
            activeTextColor: '#03E3FF'
          },
          rightPanel: {
            backgroundColor: '#0b0f12'
          },
          typography: {
            fontFamily: 'Inter, system-ui, sans-serif',
            headings: { fontFamily: 'Space Grotesk, system-ui, sans-serif' },
            code: { fontFamily: 'ui-monospace, SFMono-Regular, Menlo, monospace', backgroundColor: '#181c1f' }
          },
          schema: {
            nestedBackground: '#0b0f12',
            requireLabelColor: '#ffb4ab'
          }
        },
        hideDownloadButton: false,
        nativeScrollbars: true
      }, document.getElementById('redoc-container'));
    </script>
  </body>
</html>
