      <!-- LOGS PAGE -->
      <div x-show="page === 'logs'" x-data="logsPage()" x-effect="if (page === 'logs') { if (!applyPendingFilter() && logs.length === 0 && loading) fetchLogs(); fetchStats(); }">

        <header class="mb-8 flex items-center gap-4">
          <h2 class="text-3xl font-bold font-headline tracking-tight text-on-surface">Request Logs</h2>
          <button @click="fetchLogs(); fetchStats()" :disabled="loading"
            :class="loading ? 'text-outline/30 cursor-not-allowed' : 'text-outline hover:text-on-surface'"
            class="px-2.5 py-1 bg-surface-container-high text-[10px] uppercase tracking-widest font-headline font-bold flex items-center gap-1.5 transition-colors duration-100"
            title="Re-read the table">
            <span class="material-symbols-outlined text-sm">refresh</span>
            <span x-text="loading ? 'Reading' : 'Refresh'"></span>
          </button>
        </header>

        <!-- Filters -->
        <div class="flex flex-wrap gap-4 mb-6 items-end">
          <div>
            <label class="block text-[10px] font-headline font-bold uppercase tracking-[0.2em] text-outline mb-2">Provider</label>
            <select x-model="filterProvider" @change="applyFilters()" class="bg-surface-container border border-outline-variant/30 text-on-surface px-3 py-2 text-sm font-mono focus:outline-none focus:border-primary-container">
              <option value="">All Providers</option>
              <option value="claude">claude</option>
              <option value="codex">codex</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-headline font-bold uppercase tracking-[0.2em] text-outline mb-2">Status</label>
            <select x-model="filterStatus" @change="applyFilters()" class="bg-surface-container border border-outline-variant/30 text-on-surface px-3 py-2 text-sm font-mono focus:outline-none focus:border-primary-container">
              <option value="">All Status</option>
              <option value="2">2xx (Success)</option>
              <option value="4">4xx (Client Err)</option>
              <option value="5">5xx (Server Err)</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-headline font-bold uppercase tracking-[0.2em] text-outline mb-2">Client</label>
            <select x-model="filterClient" @change="applyFilters()" class="bg-surface-container border border-outline-variant/30 text-on-surface px-3 py-2 text-sm font-mono focus:outline-none focus:border-primary-container">
              <option value="">All Clients</option>
              <template x-for="name in clientOptions" :key="name">
                <option :value="name" x-text="name"></option>
              </template>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-headline font-bold uppercase tracking-[0.2em] text-outline mb-2">Model</label>
            <select x-model="filterModel" @change="applyFilters()" class="bg-surface-container border border-outline-variant/30 text-on-surface px-3 py-2 text-sm font-mono focus:outline-none focus:border-primary-container">
              <option value="">All Models</option>
              <template x-for="name in modelOptions" :key="name">
                <option :value="name" x-text="name"></option>
              </template>
            </select>
          </div>
          <button x-show="hasFilters" @click="clearFilters()"
            class="self-end pb-2 text-[11px] font-mono text-primary-container hover:underline">clear filters</button>
          <div x-show="!loadError" class="text-[11px] font-mono text-outline/70 italic self-end pb-2" x-text="total + ' total logs found'"></div>
          <div class="ml-auto flex gap-2 self-end">
            <button x-show="total > 0" @click="exportCSV()"
              class="px-4 py-2 text-xs font-headline font-bold uppercase text-primary-container border border-primary-container/40 hover:bg-primary-container/10 transition-colors duration-100">
              Export CSV
            </button>
            <button x-show="total > 0" @click="clearLogs()"
              class="px-4 py-2.5 text-xs font-headline font-bold uppercase tracking-widest text-status-fail bg-[#3b1a1a] hover:bg-[#4a2020] transition-colors duration-100 flex items-center gap-2">
              <span class="material-symbols-outlined text-sm">filter_list_off</span>
              Clear All
            </button>
          </div>
        </div>

        <!-- Table -->
        <div class="bg-surface-container overflow-hidden">
          <div class="overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="bg-surface-container-lowest">
                <tr>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Time</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Status</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Request</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Client</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Provider</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Model</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Duration</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Tokens</th>
                  <th class="px-6 py-4 text-left text-[0.7rem] font-headline font-bold uppercase tracking-[0.08em] text-outline">Cost</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-outline-variant/20">
                <tr x-show="logs.length === 0">
                  <td colspan="9" class="px-6 py-10 text-center font-mono text-sm"
                    :class="loadError && !loading ? 'text-error' : 'text-outline'"
                    x-text="loading ? 'Loading...' : (loadError ? 'Could not read the logs — ' + loadError : 'No logs found')"></td>
                </tr>
                <template x-for="log in logs" :key="log.id">
                  <tr @click="toggleRow(log.id)" class="hover:bg-surface-container-high transition-colors duration-100 cursor-pointer">
                    <td class="px-6 py-4 text-on-surface font-mono text-sm whitespace-nowrap" x-text="formatTime(log.created_at)"></td>
                    <td class="px-6 py-4">
                      <span class="px-2 py-0.5 text-[10px] font-bold font-mono"
                        :class="statusBadgeClass(log.status)" x-text="log.status"></span>
                      <span x-show="log.error_code" class="block mt-1 text-[10px] font-mono text-error" x-text="log.error_code"></span>
                    </td>
                    <td class="px-6 py-4 font-mono text-[11px] whitespace-nowrap">
                      <span class="text-outline" x-text="log.method || '-'"></span>
                      <span class="text-on-surface-variant ml-1" x-text="log.path || '-'"></span>
                    </td>
                    <td class="px-6 py-4 text-on-surface text-sm font-medium" x-text="log.client_name || '-'"></td>
                    <td class="px-6 py-4 text-outline text-sm" x-text="log.provider || '-'"></td>
                    <td class="px-6 py-4 text-sm font-headline text-primary-container" x-text="log.model || '-'"></td>
                    <td class="px-6 py-4 font-mono text-sm">
                      <span class="text-white" x-text="formatDuration(log.duration_ms)"></span>
                      <span x-show="log.queued_ms" class="text-[10px] text-status-warn block" x-text="'(' + formatDuration(log.queued_ms) + ' queued)'"></span>
                    </td>
                    <td class="px-6 py-4 text-on-surface font-mono text-sm" x-text="log.tokens != null ? log.tokens.toLocaleString() : '-'"></td>
                    <td class="px-6 py-4 font-mono text-sm font-bold"
                      :class="log.cost_usd > 0 ? 'text-primary-container' : 'text-outline'"
                      x-text="formatCost(log.cost_usd)"></td>
                  </tr>
                </template>
                <template x-for="log in logs" :key="'detail-' + log.id">
                  <tr x-show="expandedId === log.id" class="bg-surface-container-lowest">
                    <td colspan="9" class="px-6 py-4">
                      <dl class="grid grid-cols-2 md:grid-cols-4 gap-4 text-[11px] font-mono">
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Request id</dt>
                          <dd class="text-on-surface-variant break-all" x-text="log.request_id || '-'"></dd>
                        </div>
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Error</dt>
                          <dd class="text-on-surface-variant" x-text="log.error_code || 'none'"></dd>
                        </div>
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Upstream model</dt>
                          <dd class="text-on-surface-variant" x-text="log.upstream_model || '-'"></dd>
                        </div>
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Upstream status</dt>
                          <dd class="text-on-surface-variant" x-text="log.api_error_status || '-'"></dd>
                        </div>
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Queued</dt>
                          <dd class="text-on-surface-variant" x-text="log.queued_ms != null ? formatDuration(log.queued_ms) : '-'"></dd>
                        </div>
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Time to first token</dt>
                          <dd class="text-on-surface-variant" x-text="log.ttft_ms != null ? formatDuration(log.ttft_ms) : '-'"></dd>
                        </div>
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Tokens in / out</dt>
                          <dd class="text-on-surface-variant">
                            <span x-text="log.tokens_in ?? '-'"></span> / <span x-text="log.tokens_out ?? '-'"></span>
                          </dd>
                        </div>
                        <div>
                          <dt class="text-outline uppercase text-[10px]">Cache write / read</dt>
                          <dd class="text-on-surface-variant">
                            <span x-text="log.cache_write_tokens ?? '-'"></span> / <span x-text="log.cache_read_tokens ?? '-'"></span>
                          </dd>
                        </div>
                      </dl>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>

          <!-- Pagination (inside table container) -->
          <div class="px-6 py-4 bg-surface-container-lowest/50 flex items-center justify-between border-t border-outline-variant/20">
            <!-- Page size selector -->
            <div class="flex items-center gap-2">
              <span class="text-outline text-[10px] uppercase tracking-wider font-headline">Show</span>
              <select @change="changeLimit($event.target.value)" :value="limit"
                class="bg-surface-container border border-outline-variant/30 text-on-surface text-xs font-mono px-2 py-1 focus:outline-none focus:border-primary-container">
                <option value="25">25</option>
                <option value="50">50</option>
                <option value="100">100</option>
              </select>
            </div>

            <!-- Page navigation -->
            <div class="flex items-center gap-1">
              <!-- First -->
              <button @click="goToPage(1)" :disabled="currentPage <= 1"
                :class="currentPage <= 1 ? 'text-outline/30 cursor-not-allowed' : 'text-outline hover:bg-surface-container-high hover:text-on-surface'"
                class="w-8 h-8 flex items-center justify-center text-xs transition-colors duration-100"
                title="First page">
                <span class="material-symbols-outlined text-[16px]">first_page</span>
              </button>
              <!-- Prev -->
              <button @click="prevPage()" :disabled="offset <= 0"
                :class="offset <= 0 ? 'text-outline/30 cursor-not-allowed' : 'text-outline hover:bg-surface-container-high hover:text-on-surface'"
                class="w-8 h-8 flex items-center justify-center text-xs transition-colors duration-100"
                title="Previous page">
                <span class="material-symbols-outlined text-[16px]">chevron_left</span>
              </button>
              <!-- Page numbers -->
              <template x-for="p in visiblePages" :key="p">
                <button @click="goToPage(p)"
                  :class="p === currentPage ? 'bg-primary-container text-on-primary font-bold' : 'text-outline hover:bg-surface-container-high hover:text-on-surface'"
                  class="w-8 h-8 flex items-center justify-center text-xs font-mono transition-colors duration-100"
                  x-text="p">
                </button>
              </template>
              <!-- Next -->
              <button @click="nextPage()" :disabled="offset + limit >= total"
                :class="offset + limit >= total ? 'text-outline/30 cursor-not-allowed' : 'text-outline hover:bg-surface-container-high hover:text-on-surface'"
                class="w-8 h-8 flex items-center justify-center text-xs transition-colors duration-100"
                title="Next page">
                <span class="material-symbols-outlined text-[16px]">chevron_right</span>
              </button>
              <!-- Last -->
              <button @click="goToPage(totalPages)" :disabled="currentPage >= totalPages"
                :class="currentPage >= totalPages ? 'text-outline/30 cursor-not-allowed' : 'text-outline hover:bg-surface-container-high hover:text-on-surface'"
                class="w-8 h-8 flex items-center justify-center text-xs transition-colors duration-100"
                title="Last page">
                <span class="material-symbols-outlined text-[16px]">last_page</span>
              </button>
            </div>

            <!-- Page info -->
            <span class="text-outline text-xs font-mono tracking-wider">
              Page <span class="text-white font-bold" x-text="currentPage"></span> of <span x-text="totalPages"></span>
            </span>
          </div>
        </div>

        <!-- Stats Summary -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mt-6">
          <p x-show="statsError" x-cloak class="md:col-span-5 bg-surface-container-low p-4 font-mono text-xs text-error"
            x-text="'Could not read the stats — ' + statsError"></p>
          <div class="md:col-span-2 bg-surface-container-low p-6 border-l-4 border-primary-container">
            <p class="text-[10px] text-outline uppercase tracking-widest mb-2 font-headline">Error Rate (Last 60m)</p>
            <div class="flex items-end gap-4">
              <h2 class="text-4xl font-headline font-bold text-white" x-text="stats ? (stats.error_rate.client_error_pct + stats.error_rate.server_error_pct).toFixed(1) + '%' : '-'"></h2>
              <div class="flex-1 h-12 bg-surface-container-lowest relative overflow-hidden">
                <div class="absolute inset-0 flex items-end gap-0.5 px-1" x-show="stats && stats.timeline">
                  <template x-for="(bucket, i) in (stats ? stats.timeline.slice(-15) : [])" :key="i">
                    <div class="flex-1 min-w-[3px]"
                      :class="bucket.errors > 0 ? 'bg-status-fail' : 'bg-outline/20'"
                      :style="'height: ' + Math.max(8, Math.min(100, (bucket.requests / Math.max(...(stats.timeline.slice(-15).map(b => b.requests || 1)))) * 100)) + '%'">
                    </div>
                  </template>
                </div>
              </div>
            </div>
          </div>
          <div class="md:col-span-3 bg-surface-container-low p-6 flex justify-between items-center">
            <div>
              <p class="text-[10px] text-outline uppercase tracking-widest mb-2 font-headline">Total Tokens (Today)</p>
              <h2 class="text-4xl font-headline font-bold text-primary-container" x-text="stats ? formatCompactNumber(stats.total_tokens) : '-'"></h2>
            </div>
            <div class="text-right">
              <p class="text-[10px] text-outline uppercase tracking-widest mb-2 font-headline">Estimated Cost</p>
              <h2 class="text-2xl font-headline font-bold text-white" x-text="stats ? '$' + stats.total_cost_usd.toFixed(2) : '-'"></h2>
            </div>
          </div>
        </div>
      </div>
